name: Passbase
description: >-
  Passbase was a developer-first identity verification (KYC) platform founded in
  Berlin and San Francisco that let companies verify users in seconds through
  facial comparison, liveness detection, and authenticity checks on
  government-issued IDs from 190+ countries. It shipped mobile and web client
  SDKs plus a server-side Verifications API (v2) for reading verified identities,
  their resources and data points, and project settings, with webhooks for
  verification lifecycle events. Passbase was acquired by Parallel Markets in
  March 2023; api.passbase.com and docs.passbase.com are no longer live, and this
  API Evangelist profile captures the last-published API surface reconstructed
  from the company's official OpenAPI-generated SDKs. Backed by Cowboy Ventures
  and Seedcamp.
